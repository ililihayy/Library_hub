version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library_hub_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/library_hub.db
      API_PREFIX: /api/v1
      PROJECT_NAME: Library Hub API
    volumes:
      - backend_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: library_hub_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
